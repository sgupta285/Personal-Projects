<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NYC Public Space Explorer</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <div id="app">
    <aside id="sidebar" aria-label="Filters and information">
      <header>
        <h1>NYC Public Space Explorer</h1>
        <p class="subtitle">
          Parks, gardens, plazas, and playgrounds across the five boroughs.
        </p>
      </header>

      <p id="result-count" class="count" aria-live="polite">Loading&hellip;</p>

      <div class="field">
        <label for="search">Search by name</label>
        <input type="search" id="search" placeholder="e.g. Prospect Park" autocomplete="off" />
      </div>

      <fieldset class="field">
        <legend>Borough</legend>
        <div id="borough-filters" class="checklist"></div>
      </fieldset>

      <fieldset class="field">
        <legend>Space type</legend>
        <div id="type-filters" class="checklist"></div>
      </fieldset>

      <div class="field">
        <label for="acres">Minimum size: <span id="acres-value">0</span> acres</label>
        <input type="range" id="acres" min="0" max="50" step="0.5" value="0" />
      </div>

      <div class="field checkbox-row">
        <input type="checkbox" id="waterfront" />
        <label for="waterfront">Waterfront only</label>
      </div>

      <button id="reset" type="button">Reset filters</button>

      <footer>
        <p>
          Data: <a href="https://data.cityofnewyork.us/" target="_blank" rel="noopener">NYC Open Data</a>,
          Parks Properties. Points are polygon centroids.
        </p>
      </footer>
    </aside>

    <main id="map" role="application" aria-label="Map of NYC public spaces"></main>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="js/app.js"></script>
</body>
</html>
